name: Full exact-head tests

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "go.mod"
      - "go.sum"
      - "internal/ci/**"
      - "internal/workspace/**"
      - "internal/workspacecmd/**"
      - "scripts/ci-baseline.sh"
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact commit SHA to validate
        required: true
        type: string
      profile:
        description: Full assurance or operator-invoked stress
        required: true
        default: full
        type: choice
        options:
          - full
          - stress

permissions:
  contents: read

jobs:
  full-tests:
    if: ${{ github.event_name == 'pull_request' || inputs.profile == 'full' }}
    name: Full (${{ matrix.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            os: ubuntu-24.04
            parallel: 4
            suite: normal
          - name: normal
            os: macos-15
            parallel: 4
            suite: normal
          - name: shuffle
            os: ubuntu-24.04
            parallel: 4
            suite: shuffle
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      FEATURE_TEST_PARALLEL: ${{ matrix.parallel }}
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Check out the exact requested head
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          submodules: false

      - name: Install Go 1.26.0 without dependency caching
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          cache: false
          check-latest: false
          go-version: "1.26.0"

      - name: Assert exact head and credential isolation
        run: ./scripts/ci-baseline.sh assert-head

      - name: Run uncached ${{ matrix.name }} tests
        run: ./scripts/ci-baseline.sh "${{ matrix.suite }}"

      - name: Verify the checkout stayed clean
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: ./scripts/ci-baseline.sh clean

  stress:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'stress' }}
    name: Stress (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shuffle-1700000000
            seed: "1700000000"
            suite: shuffle
          - name: shuffle-1700000001
            seed: "1700000001"
            suite: shuffle
          - name: shuffle-1700000002
            seed: "1700000002"
            suite: shuffle
          - name: single-slot
            seed: ""
            suite: single-slot
          - name: repeated-concurrency
            seed: ""
            suite: stress-concurrency
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
      FEATURE_SHUFFLE_SEED: ${{ matrix.seed }}
      FEATURE_TEST_PARALLEL: "4"
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Check out the exact requested head
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
          submodules: false

      - name: Install Go 1.26.0 without dependency caching
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          cache: false
          check-latest: false
          go-version: "1.26.0"

      - name: Assert exact head and credential isolation
        run: ./scripts/ci-baseline.sh assert-head

      - name: Run uncached ${{ matrix.name }} tests
        run: ./scripts/ci-baseline.sh "${{ matrix.suite }}"

      - name: Verify the checkout stayed clean
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: ./scripts/ci-baseline.sh clean
